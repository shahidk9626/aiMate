# Alembic configuration. The database URL is NOT stored here: env.py builds
# it from settings (owner role, POSTGRES_USER / POSTGRES_PASSWORD).
#
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate -m "short description"

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
# Sequential, readable revision files: 0001_baseline.py, 0002_...
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC
path_separator = os

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = %(here)s/.venv/bin/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# Alembic's own console logging. The app's structlog setup is not used here.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
